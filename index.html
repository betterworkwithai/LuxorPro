<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary Meta -->
    <title>Luxor Pro — Controle Financeiro Inteligente</title>
    <meta name="description" content="Luxor Pro é o app de finanças pessoais mais completo do Brasil. Controle investimentos, fluxo de caixa, metas e patrimônio com inteligência artificial. Experimente grátis por 7 dias." />
    <meta name="author" content="Luxor Pro" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.luxorpro.com.br/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.luxorpro.com.br/" />
    <meta property="og:title" content="Luxor Pro — Controle Financeiro Inteligente" />
    <meta property="og:description" content="Controle investimentos, fluxo de caixa, metas e patrimônio com IA. O app de finanças pessoais mais completo do Brasil. 7 dias grátis." />

    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Luxor Pro" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.luxorpro.com.br/" />
    <meta name="twitter:title" content="Luxor Pro — Controle Financeiro Inteligente" />
    <meta name="twitter:description" content="Controle investimentos, fluxo de caixa, metas e patrimônio com IA. 7 dias grátis." />
    <meta name="twitter:image" content="https://www.luxorpro.com.br/og-image.png" />

    <!-- Structured Data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Luxor Pro",
      "url": "https://www.luxorpro.com.br",
      "description": "App de finanças pessoais com controle de investimentos, fluxo de caixa, metas financeiras e gestão de patrimônio com inteligência artificial.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": [
        {
          "@type": "Offer",
          "name": "Assinatura Mensal",
          "price": "29.90",
          "priceCurrency": "BRL",
          "billingIncrement": "P1M",
          "availability": "https://schema.org/InStock",
          "url": "https://www.luxorpro.com.br/#planos",
          "category": "subscription"
        },
        {
          "@type": "Offer",
          "name": "Assinatura Anual",
          "price": "180.00",
          "priceCurrency": "BRL",
          "billingIncrement": "P1Y",
          "availability": "https://schema.org/InStock",
          "url": "https://www.luxorpro.com.br/#planos",
          "category": "subscription"
        },
        {
          "@type": "Offer",
          "name": "Acesso Vitalício",
          "price": "597.00",
          "priceCurrency": "BRL",
          "availability": "https://schema.org/InStock",
          "url": "https://www.luxorpro.com.br/#planos",
          "category": "lifetime"
        }
      ],
      "inLanguage": "pt-BR",
      "countryOfOrigin": "BR",
      "publisher": {
        "@type": "Organization",
        "name": "Luxor Pro",
        "url": "https://www.luxorpro.com.br"
      }
    }
    </script>

    <!-- Structured Data — FAQPage (mirrors the FAQ section on the landing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O Luxor Pro é seguro para meus dados financeiros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Utilizamos criptografia de ponta a ponta (TLS 1.3), infraestrutura Supabase com conformidade SOC 2, e processamento de pagamentos via Stripe — o mesmo usado por Amazon e Shopify. Seus dados nunca são vendidos ou compartilhados."
          }
        },
        {
          "@type": "Question",
          "name": "Posso cancelar a qualquer momento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutamente. Nos planos mensais e anuais, você pode cancelar com um clique direto pelo portal do cliente — sem burocracia, sem ligações. Você mantém acesso até o fim do período pago."
          }
        },
        {
          "@type": "Question",
          "name": "O que está incluído nos 7 dias grátis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Acesso completo a todas as funcionalidades: dashboard, investimentos, fluxo de caixa, metas, IA de documentos e ferramentas financeiras."
          }
        },
        {
          "@type": "Question",
          "name": "Funciona com todos os bancos brasileiros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A IA de documentos processa PDFs e extratos do Nubank, Itaú, Bradesco, Santander, XP Investimentos e outros. Você também pode cadastrar ativos manualmente em qualquer instituição."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o acesso vitalício?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É um pagamento único de R$ 597 que garante acesso ao Luxor Pro para sempre — incluindo todas as atualizações futuras. Sem mensalidades, sem surpresas. Pague uma vez, use para sempre."
          }
        },
        {
          "@type": "Question",
          "name": "E se eu não ficar satisfeito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nos planos anuais e vitalício, oferecemos 30 dias de garantia de reembolso total. Se por qualquer motivo não ficar satisfeito, basta enviar um e-mail para suporte@luxorpro.com.br e devolvemos 100% do valor pago."
          }
        },
        {
          "@type": "Question",
          "name": "Posso usar em vários dispositivos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Luxor Pro é 100% web — acesse de qualquer computador, tablet ou celular. Seus dados sincronizam em tempo real em todos os dispositivos."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso instalar algum aplicativo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O Luxor Pro roda diretamente no navegador, sem instalação. Funciona perfeitamente no Chrome, Safari, Firefox e Edge — em qualquer sistema operacional."
          }
        }
      ]
    }
    </script>

    <!-- Preconnect to font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Inter + Playfair Display
         Loaded asynchronously to avoid blocking the first paint. The
         media=print → onload='all' trick lets the browser fetch the stylesheet
         without making it render-blocking; <noscript> covers no-JS bots. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Stripe Buy Button — deferred and parked at end of body so it doesn't
         compete with the critical path. Only the pricing section uses it. -->
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
  </body>
</html>
